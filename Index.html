<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ff5f9e,#ff9ecf);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#fff;
padding:25px;
width:340px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
text-align:center;
}

img{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:5px solid #ff5f9e;
margin-bottom:15px;
}

h1{
color:#ff2d75;
font-size:34px;
}

h2{
margin-top:10px;
color:#333;
}

p{
margin-top:15px;
color:#555;
line-height:1.6;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff2d75;
color:white;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
background:#ff0059;
}
</style>

</head>
<body>

<div class="card">

<img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600" alt="Birthday">

<h1>🎉 Happy Birthday 🎂</h1>

<h2>Dear Best Friend ❤️</h2>

<p>
May your birthday bring endless happiness,
good health, success, and lots of love.
May every dream come true and may God
always bless you with joy and peace.
Have a wonderful year ahead! 💖✨
</p>

<button onclick="wish()">🎁 Open Surprise</button>

</div>

<script>
function wish(){
alert("🎂 Happy Birthday! God bless you always. Stay happy forever ❤️🥳");
}
</script>

</body>
</html>
